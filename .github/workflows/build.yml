name: Offline QA (no native game build)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qa:
    name: Windows offline checks (not release approval)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Declare validation scope
        shell: pwsh
        run: |
          '## Offline validation only' >> $env:GITHUB_STEP_SUMMARY
          'This job does not generate or compile neverdead.exe. Private game assets are unavailable. Historical reports and skipped live checks do not approve gameplay or a release.' >> $env:GITHUB_STEP_SUMMARY

      - name: Verify Clean Workspace (No Proprietary Game Binaries)
        shell: pwsh
        run: |
          Write-Host "Verifying absence of proprietary game assets and retail dumps..."
          $forbidden = Get-ChildItem -Recurse -Include *.xex, *.iso, *.bin, *.zar, *.asrBE -File -ErrorAction SilentlyContinue
          if ($forbidden.Count -gt 0) {
            Write-Error "Proprietary binary files detected in repository: $($forbidden.FullName -join ', ')"
            exit 1
          }
          Write-Host "[OK] Clean repository: zero proprietary assets found."

      - name: Execute QA Smoke Test (Regression & Invariants Check)
        shell: pwsh
        run: |
          Write-Host "Running QA automated regression suite against benchmark baselines..."
          python analysis/qa_smoke_test.py --verify-recent
          if ($LASTEXITCODE -ne 0) {
            Write-Error "QA Smoke Test verification failed."
            exit 1
          }
          Write-Host "[OK] QA regression checks passed successfully."

      - name: Test Gameplay Profiler Safety
        shell: pwsh
        run: python -m unittest analysis.test_profile_n13

      - name: Test Launcher Without Game Assets
        shell: powershell
        run: ./analysis/test_launcher.ps1

      - name: Parse PowerShell Harnesses
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem analysis -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { exit 1 }

      - name: Verify Live Test Runner Guard (Asset-Dependent Gate)
        shell: pwsh
        run: |
          Write-Host "Verifying that live execution mode correctly handles absent assets on CI runner..."
          python analysis/qa_smoke_test.py --run-live --seconds 2
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Live test runner guard failed."
            exit 1
          }
          Write-Host "[OK] Live test guard correctly identified absence of retail game dump and skipped."
